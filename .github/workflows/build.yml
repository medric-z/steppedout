name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/SteppedOut.csproj -c Release
      # Two tests need a real signed-in screen (text colors, a page's fit); they run on a PC, not here.
      - run: dotnet test tests/SteppedOut.Tests.csproj -c Release --filter "TestCategory!=Desktop"
      - run: dotnet publish src/SteppedOut.csproj -c Release -r win-x64 -o publish/win-x64
      - name: smoke test the published exe
        run: |
          $out = ./publish/win-x64/SteppedOut.exe --once --dry-run | Out-String
          $out
          if ($out -notmatch 'verdict:') { exit 1 }
