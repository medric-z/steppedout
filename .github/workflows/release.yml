name: release

on:
  push:
    tags: ['v*']

# Each job gets only what it needs: the build, which runs the tests and their packages, cannot
# write to the repository, and only the release job can.
permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Two tests need a real signed-in screen (text colors, a page's fit); they run on a PC, not here.
      - if: matrix.rid == 'win-x64'
        run: dotnet test tests/SteppedOut.Tests.csproj -c Release --filter "TestCategory!=Desktop"
      - run: dotnet publish src/SteppedOut.csproj -c Release -r ${{ matrix.rid }} -p:ContinuousIntegrationBuild=true -o out
      - run: Move-Item out/SteppedOut.exe out/SteppedOut-${{ matrix.rid }}.exe
      # Provenance only means something for a public build; private test releases skip it.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/SteppedOut-${{ matrix.rid }}.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}
          path: out/SteppedOut-${{ matrix.rid }}.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      # Only for the release notes; the files come from the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - run: >
          gh release create "$GITHUB_REF_NAME"
          out/SteppedOut-win-x64.exe out/SteppedOut-win-arm64.exe out/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: verify the attestation the way a user would
        if: ${{ !github.event.repository.private }}
        run: gh attestation verify out/SteppedOut-win-x64.exe --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
